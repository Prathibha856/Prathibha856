<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 110" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="quoteTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect width="850" height="110" rx="12" fill="#090d16" fill-opacity="0.85" stroke="#1e293b" stroke-width="1" />

  <!-- Top decorative hairline -->
  <line x1="60" y1="1" x2="790" y2="1" stroke="url(#dividerGrad)" stroke-width="1.5" />

  <!-- Quote marks & text -->
  <g transform="translate(425, 48)" text-anchor="middle">
    <!-- Quote symbol -->
    <text x="0" y="-12" fill="#38bdf8" font-family="Georgia, serif" font-size="28" font-style="italic" opacity="0.6">“</text>
    <!-- Main Quote -->
    <text x="0" y="12" fill="url(#quoteTextGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" font-style="italic" letter-spacing="0.3">
      Not who I was. Not yet who I&apos;ll be. But becoming her, every single day.
    </text>
    <!-- Author / Attribution -->
    <text x="0" y="38" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10.5" font-weight="600" letter-spacing="1.5">
      — PRATHIBHA D
    </text>
  </g>

  <!-- Bottom decorative hairline -->
  <line x1="150" y1="109" x2="700" y2="109" stroke="url(#dividerGrad)" stroke-width="1" stroke-opacity="0.5" />
  <!-- Center node -->
  <circle cx="425" cy="109" r="3" fill="#818cf8" />
</svg>
