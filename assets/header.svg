<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>
    <radialGradient id="cyanOrb" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleOrb" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="850" height="240" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />
  <rect width="850" height="240" rx="16" fill="url(#cyanOrb)" />
  <rect width="850" height="240" rx="16" fill="url(#purpleOrb)" />
  <rect width="850" height="240" rx="16" fill="url(#grid)" />

  <!-- Top Terminal Header Bar -->
  <line x1="0" y1="36" x2="850" y2="36" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="28" cy="18" r="4.5" fill="#ef4444" opacity="0.8" />
  <circle cx="44" cy="18" r="4.5" fill="#eab308" opacity="0.8" />
  <circle cx="60" cy="18" r="4.5" fill="#22c55e" opacity="0.8" />
  <text x="80" y="22" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="500">prathibha-d // workspace</text>

  <!-- Status Pill -->
  <g transform="translate(680, 8)">
    <rect width="144" height="20" rx="10" fill="#0f172a" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="12" cy="10" r="3.5" fill="#22c55e" />
    <text x="24" y="14" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.5">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- Left Content: Branding -->
  <!-- Subtitle badge -->
  <g transform="translate(40, 68)">
    <rect width="250" height="24" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <text x="14" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600" letter-spacing="1">AI / ML &amp; SOFTWARE ENGINEER</text>
  </g>

  <!-- Main Name -->
  <text x="40" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    Prathibha D
  </text>

  <!-- Secondary Tagline -->
  <text x="42" y="164" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
    Transforming raw data into intelligent, scalable, and impactful solutions.
  </text>

  <!-- Key Focus Tags -->
  <g transform="translate(42, 190)">
    <rect x="0" y="0" width="138" height="26" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="0.8" />
    <text x="14" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">🤖 Machine Learning</text>

    <rect x="148" y="0" width="125" height="26" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="0.8" />
    <text x="162" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">📊 Data Science</text>

    <rect x="283" y="0" width="145" height="26" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="0.8" />
    <text x="297" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">💻 Full-Stack Dev</text>
  </g>

  <!-- Right Side: AI/ML & Network Graphic Motif -->
  <g transform="translate(560, 48)">
    <!-- Layer 1 -->
    <circle cx="70" cy="50" r="5" fill="#38bdf8" />
    <circle cx="70" cy="95" r="4" fill="#818cf8" />
    <circle cx="70" cy="140" r="5" fill="#38bdf8" />

    <!-- Layer 2 -->
    <circle cx="140" cy="35" r="4" fill="#818cf8" />
    <circle cx="140" cy="75" r="6" fill="#c084fc" />
    <circle cx="140" cy="115" r="5" fill="#818cf8" />
    <circle cx="140" cy="155" r="4" fill="#38bdf8" />

    <!-- Layer 3 -->
    <circle cx="210" cy="55" r="5" fill="#c084fc" />
    <circle cx="210" cy="95" r="7" fill="#38bdf8" />
    <circle cx="210" cy="135" r="5" fill="#c084fc" />

    <!-- Connecting Synaptic Lines -->
    <path d="M70 50 L140 35 M70 50 L140 75 M70 95 L140 75 M70 95 L140 115 M70 140 L140 115 M70 140 L140 155" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.2" />
    <path d="M140 35 L210 55 M140 75 L210 55 M140 75 L210 95 M140 115 L210 95 M140 115 L210 135 M140 155 L210 135" stroke="#a855f7" stroke-opacity="0.25" stroke-width="1.2" />

    <!-- Central glow node -->
    <circle cx="210" cy="95" r="14" fill="#38bdf8" fill-opacity="0.2" />
    <circle cx="210" cy="95" r="7" fill="#38bdf8" />

    <!-- Decorative orbit ring -->
    <circle cx="140" cy="95" r="70" fill="none" stroke="#818cf8" stroke-opacity="0.12" stroke-dasharray="3 4" />
  </g>
</svg>
